name: build

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x, 26.x]
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.1
        ports:
          - 18001:8000
    env:
      SENECA_DYNAMO_ENDPOINT: http://localhost:18001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      # dynamodb-local has no health check tool and service containers
      # cannot override the image command, so wait for the port here.
      - name: Wait for DynamoDB Local
        run: |
          for i in $(seq 1 60); do
            (exec 3<>/dev/tcp/127.0.0.1/18001) 2>/dev/null && exit 0
            sleep 1
          done
          echo "DynamoDB Local did not start" && exit 1
      - run: npm install
      - run: npm run build --if-present
      - run: npm test
